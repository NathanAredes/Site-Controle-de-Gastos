<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Pessoais - Lançamentos</title>
    <!-- Vinculando o arquivo CSS que vamos criar a seguir -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <h1>Meu Controle Financeiro</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="lancamentos.html" class="active">Lançamentos</a>
        </nav>
    </header>

    <main class="container">
        <!-- BLOCO 1: Formulário de Cadastro -->
        <section class="card-formulario">
            <h2>Novo Lançamento</h2>
            <form id="form-transacao">
                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" required placeholder="Ex: Supermercado">
                </div>

                <div class="campo">
                    <label for="valor">Valor (R$)</label>
                    <input type="number" id="valor" step="0.01" min="0.01" required placeholder="0,00">
                </div>

                <div class="campo">
                    <label for="data">Data</label>
                    <input type="date" id="data" required>
                </div>

                <div class="campo">
                    <label for="tipo">Tipo</label>
                    <select id="tipo" required>
                        <option value="despesa">Despesa 🔴</option>
                        <option value="receita">Receita 🟢</option>
                        <option value="investimento">Investimento 🔵</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <!-- As opções virão do banco de dados no futuro, deixamos fixo para teste -->
                        <option value="1">Alimentação</option>
                        <option value="2">Lazer</option>
                    </select>
                    <a href="categorias.html" class="btn-link">Gerenciar Categorias</a>
                </div>

                <button type="submit" class="btn-salvar">Salvar Registro</button>
            </form>
        </section>

        <!-- BLOCO 2: Tabela de Histórico -->
        <section class="card-tabela">
            <h2>Histórico de Registros</h2>
            <table id="tabela-gastos">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Exemplo estático apenas para vermos o visual antes do banco -->
                    <tr class="linha-despesa">
                        <td>04/10/2026</td>
                        <td>Supermercado Central</td>
                        <td>Alimentação</td>
                        <td>Despesa</td>
                        <td>R$ 150,50</td>
                    </tr>
                    <tr class="linha-receita">
                        <td>01/10/2026</td>
                        <td>Salário Empresa X</td>
                        <td>Trabalho</td>
                        <td>Receita</td>
                        <td>R$ 3.000,00</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- Vinculando o JavaScript que controlará as ações da tela -->
    <script src="js/app.js"></script>
</body>
</html>
